# Server deployment: everything in containers, only Caddy (80/443) is exposed.
# Normally deployed by GitHub Actions (images from GHCR, see deploy/server-deploy.sh).
# Manual fallback that builds on the server: scripts/deploy.sh
# Needs a .env next to this file; see deploy/README.md.
name: trawler

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trawler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trawler
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trawler -d trawler"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Built and pushed by .github/workflows/deploy.yml; IMAGE_TAG=<commit sha> rolls back.
    image: ghcr.io/abbb1399/trawler-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # App settings (SLACK_WEBHOOK_URL, CRAWL_CRON, ...) go in .env; the connection settings below win.
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trawler:${POSTGRES_PASSWORD}@postgres:5432/trawler?schema=public
      REDIS_HOST: redis
    # Chromium needs more shared memory than Docker's 64MB default.
    ipc: host
    volumes:
      - apidata:/app/apps/api/.data
      - apistorage:/app/apps/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    # Built and pushed by .github/workflows/deploy.yml; IMAGE_TAG=<commit sha> rolls back.
    image: ghcr.io/abbb1399/trawler-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      # Clerk (optional but strongly recommended on a public site). See deploy/README.md.
      # The publishable key is also baked into the image at build time (CI build-arg); these three
      # come from ~/trawler/.env at runtime, and `docker compose up -d` re-creates web when they change.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      OWNER_EMAILS: ${OWNER_EMAILS:-}
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in .env}
    volumes:
      # Mount the directory, not the file: deploy.sh replaces the file, and a file bind mount keeps the old inode.
      - ./deploy:/etc/caddy:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  apidata:
  apistorage:
  caddydata:
  caddyconfig:
