packages:
  - apps/*
  - packages/*

# pnpm 10+ blocks postinstall scripts unless listed here.
allowBuilds:
  '@prisma/engines': true
  '@prisma/client': true
  prisma: true
  esbuild: true
  playwright: true
  workerd: false
  msgpackr-extract: false
  unrs-resolver: false
  core-js: false   # @clerk/ui dep; its postinstall only prints a funding notice
