name: deploy

# Every push to main: typecheck → build api/web images → push to GHCR → server pulls and restarts.
# Docs-only pushes skip it.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: https://3-39-184-37.sslip.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # postinstall runs prisma generate, which wants a DATABASE_URL to exist.
      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm --filter @trawler/shared build
      - run: pnpm -r typecheck

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trawler-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/trawler-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: ssh setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      # The server key only runs deploy/server-deploy.sh; the token lets it pull from GHCR for this run.
      - name: deploy
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy "${{ secrets.DEPLOY_HOST }}" "${{ github.actor }}"
      - name: smoke test
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/") && [ "$code" = 200 ] && { echo "200 OK"; exit 0; }
            sleep 5
          done
          echo "site did not come back: last status $code"; exit 1
