name: deploy

# Pull requests: typecheck + lint + unit + integration tests (check job only).
# Push to main: the same checks, then build api/web images → push to GHCR → server pulls and restarts.
# Docs-only pushes skip it.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_URL: https://3-39-184-37.sslip.io

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trawler
          POSTGRES_PASSWORD: trawler
          POSTGRES_DB: trawler_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trawler"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TZ: Asia/Seoul
      # postinstall runs prisma generate (needs DATABASE_URL set); integration tests migrate and use trawler_test.
      DATABASE_URL: postgresql://trawler:trawler@localhost:5432/trawler_test
      TEST_DATABASE_URL: postgresql://trawler:trawler@localhost:5432/trawler_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trawler/shared build
      - run: pnpm -r typecheck
      - run: pnpm --filter web lint
      - name: unit tests
        run: pnpm test
      - name: integration tests (Postgres)
        run: pnpm test:int

  build:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trawler-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/trawler-${{ matrix.app }}:${{ github.sha }}
          # Public Clerk key, inlined into the web bundle at build time (repository Variables -> CLERK_PUBLISHABLE_KEY).
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: ssh setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      # The server key only runs deploy/server-deploy.sh; the token lets it pull from GHCR for this run.
      - name: deploy
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy "${{ secrets.DEPLOY_HOST }}" "${{ github.actor }}"
      - name: smoke test
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/") && [ "$code" = 200 ] && { echo "200 OK"; exit 0; }
            sleep 5
          done
          echo "site did not come back: last status $code"; exit 1
